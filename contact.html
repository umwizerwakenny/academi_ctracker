<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Tracker - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">🚀 AcademicTracker</div>
        <ul class="nav-links">
           <li><a href="index.html">Dashboard</a></li>
<li><a href="students.html">Abanyeshuri</a></li>
<li><a href="marks.html">Amanota</a></li>
<li><a href="report-cards.html">Indangamanota</a></li>

<li><a href="announcements.html">Amatangazo</a></li>
<li><a href="contact.html">Contact</a></li>

        </ul>
    </nav>

    <main class="container">
        <header class="main-header">
            <h1>Tuvugishe / Support</h1>
            <p>Siga ubutumwa cyangwa ikibazo ufite kuri sisitemu.</p>
        </header>

        <section class="form-section">
            <h2>Ohereza Ubutumwa</h2>
            <form id="contact-form" style="margin-top: 15px;">
                <div class="form-group">
                    <label for="contact-email">Email Yawe</label>
                    <input type="email" id="contact-email" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="contact-msg">Ikibazo cyangwa Igitekerezo</label>
                    <textarea id="contact-msg" rows="4" placeholder="Andika hano..." required></textarea>
                </div>
                <button type="submit" class="btn-submit" style="background:#3b82f6;">Ohereza</button>
            </form>
        </section>
    </main>

    <script>
        document.getElementById('contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Ubutumwa bwawe bwoherejwe neza kuri Academic Prefect!');
            e.target.reset();
        });
    </script>
</body>
</html>
