<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Tracker - Kwinjira</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #0f172a; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 450px; }
        .teacher-fields { display: none; margin-top: 15px; border-top: 1px dashed #cbd5e1; padding-top: 15px; }
    </style>
</head>
<body class="login-body">

    <div class="login-box">
        <h2 style="text-align: center; color: #0f172a; margin-bottom: 5px;">🚀 AcademicTracker</h2>
        <p style="text-align: center; color: #64748b; margin-bottom: 25px;">Ikaze! Banza uhitemo uruhare (Role) rwawe mu kigo.</p>

        <form id="login-form">
            <!-- 1. Select Role -->
            <div class="form-group">
                <label for="role-select">Hitamo Uruhare (Role)</label>
                <select id="role-select" required onchange="toggleRoleFields()">
                    <option value="Student">👤 Umunyeshuri (Student)</option>
                    <option value="Teacher">👑 Umwarimu (Teacher)</option>
                </select>
            </div>

            <!-- 2. Teacher Only Fields (Zizaka gusa mwarimu ahiswemo) -->
            <div id="teacher-fields-box" class="teacher-fields">
                <div class="form-group">
                    <label for="teacher-name">Izina Ryombi (Teacher Name)</label>
                    <input type="text" id="teacher-name" placeholder="Ugereranyije: MUGISHA Eric">
                </div>
                <div class="form-group">
                    <label for="teacher-email">Email Yawe</label>
                    <input type="email" id="teacher-email" placeholder="eric@gmail.com">
                </div>
                <div class="form-group">
                    <label for="teacher-password">Ijambo ry'ibanga (Password)</label>
                    <input type="password" id="teacher-password" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 15px; background: #3b82f6;">Injira mu Agasistimu</button>
        </form>
    </div>

    <script src="js/app.js"></script>
    <script>
        function toggleRoleFields() {
            const role = document.getElementById('role-select').value;
            const teacherBox = document.getElementById('teacher-fields-box');
            
            if (role === 'Teacher') {
                teacherBox.style.display = 'block';
                document.getElementById('teacher-name').required = true;
                document.getElementById('teacher-email').required = true;
                document.getElementById('teacher-password').required = true;
            } else {
                teacherBox.style.display = 'none';
                document.getElementById('teacher-name').required = false;
                document.getElementById('teacher-email').required = false;
                document.getElementById('teacher-password').required = false;
            }
        }

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = document.getElementById('role-select').value;

            if (role === 'Student') {
                localStorage.setItem('userRole', 'Student');
                localStorage.removeItem('activeTeacher'); // Siba umwarimu wari uriho mbanziriza
                window.location.href = 'dashboard.html';
            } else {
                const name = document.getElementById('teacher-name').value.trim();
                const email = document.getElementById('teacher-email').value.trim();
                const pass = document.getElementById('teacher-password').value;

                // 🔑 PASSWORD Y'ABARIMU BOSE
                if (pass === 'Bethel2026') {
                    localStorage.setItem('userRole', 'Teacher');
                    
                    const teacherInfo = { name: name, email: email };
                    localStorage.setItem('activeTeacher', JSON.stringify(teacherInfo));

                    // 📝 Bika muli Log ko uyu mwarimu yinjiye ubu
                    logActivity(name, "Yinjiye mu agasistimu (Logged In)");

                    window.location.href = 'dashboard.html';
                } else {
                    alert("Ijambo ry'ibanga si ryo! Ntabwo wemerewe kwinjira nka Mwarimu.");
                }
            }
        });
    </script>
</body>
</html>
