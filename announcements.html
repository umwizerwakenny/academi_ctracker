</head>
<body>

    <nav class="navbar">
        <div class="logo">🚀 AcademicTracker</div>

<li><a href="students.html">Abanyeshuri</a></li>

    <main class="container">
        <header class="main-header">
            <h1>Amatangazo ya Academic Prefect</h1>
            <p>Tanga amatangazo arebana n'imyigire cyangwa ibizamini by'ishuri.</p>
        </header>

        <section class="form-section">
            <h2>Andika Itangazo Mashya</h2>
            <form id="announcement-form" style="margin-top: 15px;">
                <div class="form-group">
                    <label for="ann-title">Umutwe w'Itangazo</label>
                    <input type="text" id="ann-title" placeholder="Ugereranyije: Itangazo ry'Ibizamini" required>
                </div>
                <div class="form-group">
                    <label for="ann-content">Ibirimo (Message)</label>
                    <textarea id="ann-content" rows="4" placeholder="Andika hano amakuru yose..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Kwirakwiza Itangazo</button>
            </form>
        </section>

        <section id="announcements-list" style="margin-top:20px;"></section>
    </main>

    <script src="app.js"></script>
    <script src="announcements.js"></script>
</body>
